<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Spotify Auto Pause</title>

<link rel="stylesheet" href="popup.css">

</head>

<body>
    <main class="popup">
        <header class="header">
            <img
                class="logo"
                src="/assets/logo.png"
                alt="Spotify Auto Pause logo"
            >
        <div>
            <h1>Spotify Auto Pause</h1>
            <span class="version">v2.0.0</span>
        </div>
    </header>

    <section class="status" id="extension-status">
        <span class="status-indicator" id="status-indicator"></span>

        <div>
            <strong id="extension-status-title"></strong>
            <p id="extension-status-description"></p>
        </div>
    </section>

    <section class="setting"> 
        <div> 
            <strong id="autopause-title"></strong> 
            <p id="autopause-description"></p> 
        </div> 
        <label class="switch"> 
            <input type="checkbox" id="autopause-toggle"> 
            <span class="slider"></span> 
        </label> 
    </section>
    
    <section class="info">
        <div class="info-item">
            <span id="spotify-label" class="label"></span>
            <span id="spotify-status" class="value"></span>
        </div>

        <div class="info-item">
            <span id="media-label" class="label"></span>
            <span id="media-status" class="value"></span>
        </div>
    </section>

    <footer>
        <span>Spotify Auto Pause</span>
    </footer>
</main>

<script src="/config.js"></script>
<script src="popup.js"></script>

</body>
</html>
